name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  common-lisp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl swi-prolog-nox

      - name: Load and test Symac
        run: |
          sbcl --noinform --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:load-asd #p\"$PWD/symac.asd\")" \
            --eval '(asdf:test-system "symac")'

      - name: Test deterministic Prolog distro compiler
        run: |
          swipl -q -s prolog/distro/tests.pl -g run_tests,halt
          swipl -q -s prolog/distro/cli.pl -- \
            render nix examples/distro/workstation.pl workstation > /tmp/symac.nix
          swipl -q -s prolog/distro/cli.pl -- \
            render guix examples/distro/workstation.pl workstation > /tmp/symac.scm
          grep -q 'environment.systemPackages' /tmp/symac.nix
          grep -q '%symac-packages' /tmp/symac.scm

          swipl -q -s prolog/distro/cli.pl -- \
            agent examples/distro/workstation.pl workstation \
            ensure-package emacs /tmp/agent-facts.pl
          grep -q 'package(workstation,emacs)' /tmp/agent-facts.pl
          swipl -q -s prolog/distro/cli.pl -- \
            render nix /tmp/agent-facts.pl workstation > /tmp/agent-symac.nix
          grep -q '"emacs"' /tmp/agent-symac.nix

          printf "error: undefined variable 'swiProlog'\n" > /tmp/nix-diagnostic.log
          swipl -q -s prolog/distro/cli.pl -- \
            repair nix examples/distro/workstation.pl workstation \
            /tmp/nix-diagnostic.log /tmp/repaired-facts.pl
          grep -q 'backend_package(nix,swi_prolog,"swi-prolog")' /tmp/repaired-facts.pl

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Parse generated Nix
        run: nix-instantiate --parse /tmp/symac.nix >/dev/null

      - name: Check Symac flake
        run: nix flake check --no-write-lock-file
